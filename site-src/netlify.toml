[build]
  command = "python build2.py"
  publish = "site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  PYTHON_VERSION = "3.12"

# Desactive la reecriture d'URL de Netlify (Pretty URLs)
# Sans ca, /page.html est redirige vers /page => conflit avec les balises canonical
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Redirections 301 des anciennes URL sans .html (heritage Pretty URLs)
# Elles consolident le jus SEO vers l'URL canonique et vident les doublons.

