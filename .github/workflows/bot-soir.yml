# HORAIRES AUTOMATIQUES RETIRES (GitHub ne les lançait pas) : tout part des réveils Cloudflare 6h / 13h / 21h.
# Ce bouton reste pour lancer un message à la main.
# Messages du soir du bot dans le canal Telegram (secours : les horaires Cloudflare de 21h et minuit ne partaient pas).
# 12h00 UTC = 13h00 Cameroun : la seule promo du jour (rien pendant la trêve).
# 20h00 UTC = 21h00 Cameroun : résultats validés.  22h45 UTC = 23h45 Cameroun : pronostics de la nuit (NBA).
# La clé envoyée au bot est une empreinte du jeton Telegram (jamais le jeton lui-même).
name: Bot - messages du soir

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "bilan (résultats validés), nuit (pronostics de la nuit) ou midi (promo de 13h)"
        required: true
        default: "bilan"

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Appeler le bot
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SLOT_IN: ${{ github.event.inputs.slot }}
          SCHED: ${{ github.event.schedule }}
        run: |
          SLOT="$SLOT_IN"
          if [ -z "$SLOT" ]; then
            if [ "$SCHED" = "45 22 * * *" ]; then SLOT=nuit; elif [ "$SCHED" = "0 12 * * *" ]; then SLOT=midi; else SLOT=bilan; fi
          fi
          KEY=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)
          BOT=https://cousinmarc-bot.fokamjeanmarc2004.workers.dev
          if [ "$SLOT" = "bilan" ]; then
            curl -sS -H "X-Tick-Key: $KEY" "$BOT/tick?slot=nba"; echo
            sleep 200
          fi
          curl -sS -H "X-Tick-Key: $KEY" "$BOT/tick?slot=$SLOT"; echo
