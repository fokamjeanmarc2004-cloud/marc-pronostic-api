# DESACTIVE : le bot tourne maintenant sur Cloudflare Workers (dossier worker/).
# Ne pas relancer : Telegram envoie les messages directement a Cloudflare.
# Bot Telegram -> coupons du site (cote2.jpg, tpi-1xbet.jpg, tpi-melbet.jpg, result-photo.jpg)
# Verifie les nouveaux messages du bot toutes les 5 minutes et publie les photos recues.
name: Coupons depuis Telegram

on:
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: telegram-coupons
  cancel-in-progress: false

jobs:
  coupons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire les messages du bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_ID: ${{ secrets.TELEGRAM_ALLOWED_ID }}
        run: python scripts/telegram_coupons.py

      - name: Publier les nouvelles photos
        run: |
          git config user.name "cousinmarc-bot"
          git config user.email "cousinmarc-bot@users.noreply.github.com"
          git add -A cote2.jpg tpi-1xbet.jpg tpi-melbet.jpg result-photo.jpg .telegram_offset 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Coupon mis a jour depuis Telegram"
            git push
          fi
